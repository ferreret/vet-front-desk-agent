# Planeta Animal: everything the front desk may tell a caller.
#
# This file is the ONLY source of clinic facts. The agent's prompt is built from it and the
# agenda takes its opening hours from it; nothing here is repeated anywhere else by hand.
# It is validated when loaded (see vetdesk/kb/model.py): placeholders, gaps in the opening
# hours and malformed phone numbers are rejected.
#
# The clinic, its address and its phone numbers are fictional.

[clinic]
name = "Planeta Animal"
address = "Carrer Major, 12, Vallserena"
phone = "+34971555010"
languages = ["es", "ca"]

[emergency]
phone = "+34600555020"
description = "Urgencias veterinarias las 24 horas, todos los días del año. Fuera del horario de la clínica atiende el veterinario de guardia en este teléfono."

[appointments]
slot_minutes = 30
notes = [
    "Las visitas son con cita previa. Las urgencias se atienden sin cita.",
    "Para cancelar o cambiar una cita se agradece avisar con 24 horas de antelación.",
    "En la primera visita conviene traer la cartilla o el pasaporte del animal.",
]

