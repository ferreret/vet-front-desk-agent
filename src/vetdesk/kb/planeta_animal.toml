[[services]]
name = "Consulta general"
description = "Revisión, diagnóstico y tratamiento de perros, gatos y animales exóticos."
price_from_eur = 35

[[services]]
name = "Vacunación anual"
description = "Incluye una revisión general. El precio depende de la especie y de las vacunas que toquen."
price_from_eur = 40

[[services]]
name = "Desparasitación"
description = "Interna y externa. Se recomienda cada tres meses."
price_from_eur = 15

[[services]]
name = "Microchip e identificación"
description = "Implantación del microchip y alta en el registro."
price_from_eur = 40

[[services]]
name = "Esterilización"
description = "Con analítica previa. El precio depende de la especie, el sexo y el peso."
price_from_eur = 150

[[services]]
name = "Limpieza dental"
description = "Con anestesia general y revisión de la boca."
price_from_eur = 120

[[services]]
name = "Análisis de sangre"
description = "Laboratorio propio; resultados el mismo día en la mayoría de los casos."
price_from_eur = 50

[[services]]
name = "Radiografía"
description = "Radiología digital."
price_from_eur = 60

[[services]]
name = "Ecografía"
description = "Abdominal y de gestación."
price_from_eur = 70

[[services]]
name = "Corte de uñas"
description = "Sin cita si hay hueco; mejor llamar antes."
price_from_eur = 10

[species]
treated = ["perros", "gatos", "conejos", "hurones", "cobayas", "hámsteres", "aves", "tortugas"]
not_treated = ["caballos", "animales de granja", "reptiles venenosos"]

[[faq]]
question = "¿Los precios son definitivos?"
answer = "No. Son precios orientativos, desde el importe indicado. El precio final lo da el veterinario tras ver al animal."

[[faq]]
question = "¿Cómo se puede pagar?"
answer = "En efectivo, con tarjeta o por Bizum."

[[faq]]
question = "¿Hay aparcamiento?"
answer = "Hay zona azul en la misma calle y un aparcamiento público a dos minutos a pie."

[[faq]]
question = "¿Hacen visitas a domicilio?"
answer = "No. Todas las visitas son en la clínica."

[[faq]]
question = "¿Tienen peluquería?"
answer = "No. La clínica no ofrece peluquería, solo corte de uñas."

[[faq]]
question = "¿Qué hago si es urgente y la clínica está abierta?"
answer = "Venir directamente a la clínica o llamar al teléfono de urgencias para avisar de que se viene de camino."
